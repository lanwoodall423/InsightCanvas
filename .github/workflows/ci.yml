name: Portable core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    name: Portable .NET 8 harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: Tests/InsightCanvas.CoreTests.csproj

      - name: Restore, build, and run portable harness
        run: dotnet run --project Tests/InsightCanvas.CoreTests.csproj --configuration Release
